name: Debug
on:
  push:
    branches: [ci-debug]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Valgrind
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq valgrind > /dev/null
          HEX=073c71a6db10457aafe4194e83b801000000c1f6ffffffff
          g++ -std=c++17 -O2 -g -DNDEBUG -Isrc -Isrc/core tests/fuzz.cpp src/core/*.cpp -lpthread -ldl -o fz
          HD_NO_PYTHON=1 HD_FUZZ_ONLY=boolean HD_FUZZ_REPLAY=$HEX valgrind -q --num-callers=30 ./fz 1 2>&1 | grep -v "inputs ok" | grep -v zlibCompress | head -150 || true
