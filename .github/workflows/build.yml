name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Universal)
            os: macos-latest
            artifact: HD-macOS
            cmake_args: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          - name: Windows
            os: windows-latest
            artifact: HD-Windows
            cmake_args: ""
          - name: Linux
            os: ubuntu-latest
            artifact: HD-Linux
            cmake_args: -DGLFW_BUILD_WAYLAND=OFF

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xorg-dev libgl1-mesa-dev ninja-build

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist/HD
          cp -R build/HD.app dist/HD/
          cp build/hdc dist/HD/
          cp -R examples dist/HD/examples
          cp README.md dist/HD/
          ln -s /Applications dist/HD/Applications
          hdiutil create -volname "HD" -srcfolder dist/HD -ov -format UDZO dist/${{ matrix.artifact }}.dmg

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/HD | Out-Null
          Copy-Item build/Release/HD.exe dist/HD/
          Copy-Item build/Release/hdc.exe dist/HD/
          Copy-Item -Recurse examples dist/HD/examples
          Copy-Item README.md dist/HD/
          Compress-Archive -Path dist/HD -DestinationPath dist/${{ matrix.artifact }}.zip

      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            choco install nsis -y --no-progress
          }
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(HD VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          $root = (Get-Location).Path
          & $makensis /V2 "/DVERSION=$version" "/DSRCDIR=$root\dist\HD" "/DOUTFILE=$root\dist\HD-Windows-Setup.exe" packaging\windows\installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/HD
          cp build/HD build/hdc dist/HD/
          cp -R examples dist/HD/examples
          cp README.md dist/HD/
          tar -C dist -czf dist/${{ matrix.artifact }}.tar.gz HD

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.tar.gz

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.tar.gz

  sanitizers:
    name: Sanitizers + fuzzing (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with AddressSanitizer and UndefinedBehaviorSanitizer
        run: |
          cmake -S . -B build-asan -DHD_BUILD_APP=OFF -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-asan --parallel
      - name: Core tests under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ./build-asan/hd_tests
      - name: Fuzz every parser (3000 mutated inputs per target)
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: |
          mkdir -p fuzzwork && cd fuzzwork
          ../build-asan/hd_fuzz 3000 ${{ github.run_number }}

  app-smoke:
    name: App smoke test (Linux, headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Mesa (software OpenGL) and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-dri libegl-mesa0 fonts-dejavu-core
      - name: Build the app for GLFW's null platform
        run: |
          cmake -S . -B build-ui -DCMAKE_BUILD_TYPE=Release -DGLFW_BUILD_X11=OFF -DGLFW_BUILD_WAYLAND=OFF \
            -DHD_BUILD_UI_SCREENSHOT_TEST=ON -DHD_BUILD_TESTS=OFF
          cmake --build build-ui --parallel --target hd_ui_smoke
      - name: Load every example in the real UI, render, undo/redo
        run: ./build-ui/hd_ui_smoke examples smoke-shots 8
      - name: Convert screenshots
        if: always()
        run: |
          python3 -m pip install --quiet pillow || true
          python3 - <<'PY' || true
          import glob
          from PIL import Image
          for p in glob.glob('smoke-shots/*.ppm'):
              Image.open(p).save(p[:-4] + '.png')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HD-UI-screenshots
          path: smoke-shots/*.png
