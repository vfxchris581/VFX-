name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Universal)
            os: macos-latest
            artifact: HD-macOS
            cmake_args: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          - name: Windows
            os: windows-latest
            artifact: HD-Windows
            cmake_args: ""
          - name: Linux
            os: ubuntu-latest
            artifact: HD-Linux
            cmake_args: -DGLFW_BUILD_WAYLAND=OFF

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xorg-dev libgl1-mesa-dev ninja-build

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Release --parallel

      # A real Python, so the Python tests run (and must pass) instead of skipping
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.12"
      - name: Test
        env:
          HD_REQUIRE_PYTHON: "1"
          HD_PYTHON: ${{ steps.py.outputs.python-path }}
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Read version
        shell: bash
        run: |
          v=$(sed -n 's/^project(HD VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "HD_VERSION=$v" >> "$GITHUB_ENV"
          echo "Version $v"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$v" ]]; then
            echo "::error::Tag ${GITHUB_REF#refs/tags/} does not match CMakeLists.txt version $v"; exit 1
          fi

      # ---------------------------------------------------------------- macOS
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist/HD
          cp -R build/HD.app dist/HD/
          cp build/hdc dist/HD/
          cp -R examples dist/HD/examples
          cp README.md dist/HD/
          cp packaging/macos/READ-ME-FIRST.txt "dist/HD/Read Me First.txt"
          # Ad-hoc signature: not a Developer ID (Gatekeeper still asks), but gives every
          # binary a valid, consistent signature, which Apple Silicon requires.
          codesign --force --deep --sign - dist/HD/HD.app
          codesign --force --sign - dist/HD/hdc
          ln -s /Applications dist/HD/Applications
          hdiutil create -volname "HD ${HD_VERSION}" -srcfolder dist/HD -ov -format UDZO dist/${{ matrix.artifact }}.dmg

      - name: Verify the disk image (macOS)
        if: runner.os == 'macOS'
        run: |
          set -e
          hdiutil attach dist/${{ matrix.artifact }}.dmg -mountpoint /tmp/hdmnt -nobrowse -readonly
          APP=/tmp/hdmnt/HD.app
          plutil -lint "$APP/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Contents/Info.plist")" = "$HD_VERSION"
          /usr/libexec/PlistBuddy -c 'Print UTExportedTypeDeclarations:0:UTTypeTagSpecification:public.filename-extension:0' "$APP/Contents/Info.plist" | grep -qx hdg
          test -f "$APP/Contents/Resources/hd.icns"
          test -f "$APP/Contents/MacOS/examples/terrain.hdg"
          lipo -archs "$APP/Contents/MacOS/HD" | grep -q arm64
          lipo -archs "$APP/Contents/MacOS/HD" | grep -q x86_64
          codesign --verify --deep --strict "$APP"
          "$APP/Contents/MacOS/HD" --version | grep "HD $HD_VERSION"
          /tmp/hdmnt/hdc --version | grep "HD $HD_VERSION"
          /tmp/hdmnt/hdc info /tmp/hdmnt/examples/terrain.hdg | tail -1
          HD_PYTHON="${{ steps.py.outputs.python-path }}" /tmp/hdmnt/hdc python /tmp/hdmnt/examples/scripts/ring_of_spheres.py | grep "12 packed"
          test -L /tmp/hdmnt/Applications
          hdiutil detach /tmp/hdmnt
          echo "Disk image OK"

      # ---------------------------------------------------------------- Windows
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/HD | Out-Null
          Copy-Item build/Release/HD.exe dist/HD/
          Copy-Item build/Release/hdc.exe dist/HD/
          Copy-Item -Recurse examples dist/HD/examples
          Copy-Item README.md dist/HD/
          Compress-Archive -Path dist/HD -DestinationPath dist/${{ matrix.artifact }}.zip

      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            choco install nsis -y --no-progress
          }
          $root = (Get-Location).Path
          & $makensis /V2 "/DVERSION=$env:HD_VERSION" "/DSRCDIR=$root\dist\HD" "/DOUTFILE=$root\dist\HD-Windows-Setup.exe" "/DICON=$root\packaging\icons\hd.ico" packaging\windows\installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify the installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = 'C:\HDInstallTest'
          $p = Start-Process -Wait -PassThru -FilePath dist\HD-Windows-Setup.exe -ArgumentList '/S', "/D=$dir"
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          foreach ($f in 'HD.exe', 'hdc.exe', 'Uninstall.exe', 'README.md', 'examples\terrain.hdg') {
            if (-not (Test-Path "$dir\$f")) { throw "missing $f" }
          }
          $key = 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\HD'
          $reg = Get-ItemProperty $key
          if ($reg.DisplayVersion -ne $env:HD_VERSION) { throw "registry version $($reg.DisplayVersion)" }
          if (-not (Test-Path 'Registry::HKEY_CLASSES_ROOT\.hdg')) { throw '.hdg association missing' }
          $vi = (Get-Item "$dir\HD.exe").VersionInfo
          if ($vi.ProductVersion -ne $env:HD_VERSION) { throw "HD.exe version resource '$($vi.ProductVersion)'" }
          $out = & "$dir\hdc.exe" --version
          Write-Host $out
          if ($out -notmatch "HD $([regex]::Escape($env:HD_VERSION))") { throw 'hdc --version mismatch' }
          & "$dir\hdc.exe" info "$dir\examples\terrain.hdg" | Select-Object -Last 1
          if ($LASTEXITCODE -ne 0) { throw 'hdc info failed' }
          $env:HD_PYTHON = "${{ steps.py.outputs.python-path }}"
          $py = & "$dir\hdc.exe" python "$dir\examples\scripts\ring_of_spheres.py"
          Write-Host $py
          if ($LASTEXITCODE -ne 0 -or ($py -join "`n") -notmatch '12 packed') { throw 'hdc python failed' }
          # Uninstall in place (_?= makes the uninstaller run synchronously)
          $u = Start-Process -Wait -PassThru -FilePath "$dir\Uninstall.exe" -ArgumentList '/S', "_?=$dir"
          if ($u.ExitCode -ne 0) { throw "uninstaller exit code $($u.ExitCode)" }
          if (Test-Path "$dir\HD.exe") { throw 'HD.exe still present after uninstall' }
          if (Test-Path "$dir\examples") { throw 'examples still present after uninstall' }
          if (Test-Path $key) { throw 'uninstall registry key still present' }
          if (Test-Path 'Registry::HKEY_CLASSES_ROOT\.hdg') { throw '.hdg association still present' }
          Write-Host 'Installer OK: install, registry, version resource, hdc, uninstall'

      # ---------------------------------------------------------------- Linux
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/HD
          cp build/HD build/hdc dist/HD/
          cp -R examples dist/HD/examples
          cp README.md packaging/linux/hd.desktop packaging/linux/hd-mime.xml packaging/linux/install.sh dist/HD/
          cp packaging/icons/hd_256.png dist/HD/hd.png
          tar -C dist -czf dist/${{ matrix.artifact }}.tar.gz HD

      - name: Verify the tarball (Linux)
        if: runner.os == 'Linux'
        run: |
          set -e
          sudo apt-get install -y desktop-file-utils shared-mime-info >/dev/null
          t=$(mktemp -d)
          tar -C "$t" -xzf dist/${{ matrix.artifact }}.tar.gz
          "$t/HD/install.sh" "$t/prefix"
          desktop-file-validate "$t/prefix/share/applications/hd.desktop"
          "$t/prefix/bin/HD" --version | grep "HD $HD_VERSION"
          "$t/prefix/bin/hdc" --version | grep "HD $HD_VERSION"
          "$t/prefix/bin/hdc" info "$t/prefix/lib/hd/examples/terrain.hdg" | tail -1
          HD_PYTHON="${{ steps.py.outputs.python-path }}" "$t/prefix/bin/hdc" python "$t/prefix/lib/hd/examples/scripts/ring_of_spheres.py" | grep "12 packed"
          grep -q "application/x-hd-scene" "$t/prefix/share/mime/globs2"
          "$t/prefix/lib/hd/uninstall.sh"
          test ! -e "$t/prefix/bin/hdc"
          test ! -e "$t/prefix/lib/hd"
          echo "Tarball OK"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.tar.gz

  sanitizers:
    name: Sanitizers + fuzzing (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with AddressSanitizer and UndefinedBehaviorSanitizer
        run: |
          cmake -S . -B build-asan -DHD_BUILD_APP=OFF -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-asan --parallel
      - name: Core tests under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
          HD_NO_PYTHON: "1" # an embedded interpreter keeps its objects until exit, which LeakSanitizer reports
        run: ./build-asan/hd_tests
      - name: Fuzz every parser (3000 mutated inputs per target)
        env:
          ASAN_OPTIONS: detect_leaks=1
          HD_NO_PYTHON: "1"
        run: |
          mkdir -p fuzzwork && cd fuzzwork
          ../build-asan/hd_fuzz 3000 ${{ github.run_number }}

  app-smoke:
    name: App smoke test (Linux, headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Mesa (software OpenGL) and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-dri libegl-mesa0 fonts-dejavu-core
      - name: Build the app for GLFW's null platform
        run: |
          cmake -S . -B build-ui -DCMAKE_BUILD_TYPE=Release -DGLFW_BUILD_X11=OFF -DGLFW_BUILD_WAYLAND=OFF \
            -DHD_BUILD_UI_SCREENSHOT_TEST=ON -DHD_BUILD_TESTS=OFF
          cmake --build build-ui --parallel --target hd_ui_smoke
      - name: Load every example in the real UI, render, undo/redo
        run: ./build-ui/hd_ui_smoke examples smoke-shots 8
      - name: Convert screenshots
        if: always()
        run: |
          python3 -m pip install --quiet pillow || true
          python3 - <<'PY' || true
          import glob
          from PIL import Image
          for p in glob.glob('smoke-shots/*.ppm'):
              Image.open(p).save(p[:-4] + '.png')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HD-UI-screenshots
          path: smoke-shots/*.png

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, sanitizers, app-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: HD-*
          merge-multiple: true
      - name: Checksums and release notes
        run: |
          rm -f artifacts/*screenshot* || true
          ls -la artifacts
          (cd artifacts && sha256sum HD-* > SHA256SUMS.txt && cat SHA256SUMS.txt)
          v=${GITHUB_REF#refs/tags/v}
          awk -v v="$v" '$0 ~ "^## "v"( |$)" {on=1; next} on && /^## / {exit} on {print}' CHANGELOG.md > notes.md
          test -s notes.md || echo "HD $v" > notes.md
          cat >> notes.md <<'EOF'

          ### Install
          - **macOS 11+ (Apple Silicon and Intel):** open `HD-macOS.dmg` and drag HD to Applications. The app is not notarized, so the first time right-click HD.app and choose **Open** (see *Read Me First* in the disk image).
          - **Windows 10/11 (64-bit):** run `HD-Windows-Setup.exe`. It is not code-signed, so SmartScreen may ask: choose **More info, Run anyway**. `HD-Windows.zip` is a portable copy.
          - **Linux (x86_64, glibc 2.39+, e.g. Ubuntu 24.04):** extract `HD-Linux.tar.gz` and run `HD/install.sh` (installs to `~/.local`).

          Verify downloads with `SHA256SUMS.txt`.
          EOF
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: HD ${{ github.ref_name }}
          body_path: notes.md
          files: |
            artifacts/HD-macOS.dmg
            artifacts/HD-Windows-Setup.exe
            artifacts/HD-Windows.zip
            artifacts/HD-Linux.tar.gz
            artifacts/SHA256SUMS.txt
